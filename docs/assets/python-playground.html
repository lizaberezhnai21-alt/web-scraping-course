<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python-пісочниця</title>
<style>
:root{font-family:system-ui,sans-serif;color:#20243a;background:#f8f9ff}
body{margin:0;padding:18px}
.panel{background:white;border:1px solid #e2e5f0;border-radius:14px;padding:16px;box-shadow:0 5px 20px #26345a0d}
h2{margin:0 0 8px;font-size:1.2rem}
p{color:#586174;margin-top:0}
textarea{box-sizing:border-box;width:100%;min-height:210px;padding:14px;border:1px solid #cbd2e4;border-radius:10px;font:14px/1.55 ui-monospace,monospace;background:#111827;color:#e5e7eb;resize:vertical}
button{margin:10px 8px 0 0;padding:10px 16px;border:0;border-radius:9px;background:#4f46e5;color:white;font-weight:600;cursor:pointer}
button.secondary{background:#e9eafe;color:#312e81}
#status{font-size:13px;color:#596276;margin:8px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f9;border-radius:9px;padding:12px;min-height:65px}
</style>
</head>
<body>
<div class="panel">
<h2>Спробуй Python у браузері</h2>
<p>Зміни приклад або напиши власний код і натисни «Запустити».</p>
<textarea id="code" spellcheck="false">products = [
    {"name": "Навушники", "price": 1200},
    {"name": "Миша", "price": 650},
    {"name": "Клавіатура", "price": 1450}
]

for product in products:
    print(product["name"], "-", product["price"], "грн")

average = sum(p["price"] for p in products) / len(products)
print("Середня ціна:", round(average, 2), "грн")</textarea>
<div>
<button id="run">Запустити</button>
<button class="secondary" id="reset">Відновити приклад</button>
</div>
<div id="status">Завантаження Python-середовища…</div>
<pre id="output" aria-live="polite">Результат виконання з’явиться тут.</pre>
</div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script>
const initialCode = document.getElementById("code").value;
const output = document.getElementById("output");
const statusEl = document.getElementById("status");
const runButton = document.getElementById("run");
let pyodide = null;

async function startPython() {
  try {
    pyodide = await loadPyodide();
    statusEl.textContent = "Python готовий до роботи.";
    runButton.disabled = false;
  } catch (error) {
    statusEl.textContent = "Не вдалося завантажити Python. Перевірте підключення до інтернету.";
    output.textContent = String(error);
  }
}
runButton.disabled = true;
startPython();

document.getElementById("run").addEventListener("click", async () => {
  if (!pyodide) return;
  output.textContent = "";
  try {
    pyodide.setStdout({batched: text => output.textContent += text + "\n"});
    pyodide.setStderr({batched: text => output.textContent += "Помилка: " + text + "\n"});
    await pyodide.runPythonAsync(document.getElementById("code").value);
    if (!output.textContent) output.textContent = "Код виконано. (Немає виведених повідомлень.)";
  } catch (error) {
    output.textContent = String(error);
  }
});
document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("code").value = initialCode;
  output.textContent = "Приклад відновлено.";
});
</script>
</body>
</html>
